group 'az.smartbee.pixel.flutter'
version '1.0.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// The app's own SDK versions win when it defines them in rootProject.ext; otherwise these fallbacks apply.
def safeExtGet = { String name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
    namespace 'az.smartbee.pixel.flutter'
    compileSdk safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 21)
        // R8 rules for the advertising-id classes that are read by reflection are passed on to the app.
        // The file is a copy of the native SDK's rules (mobile/sync-native.mjs).
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

// `android.kotlinOptions { }` is deprecated in Kotlin 2.0 and an error in later releases; the task-level
// `compilerOptions` DSL exists since Kotlin 1.8 and stays valid.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)
    }
}
