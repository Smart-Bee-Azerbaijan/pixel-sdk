name: smartbee_pixel
description: SmartBee Pixel SDK for Flutter. A thin wrapper over the native Android and iOS SDKs.
version: 1.0.0
homepage: https://c.cdnsb.net/docs
repository: https://github.com/Smart-Bee-Azerbaijan/pixel-sdk/tree/main/mobile/flutter

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: az.smartbee.pixel.flutter
        pluginClass: SmartBeePixelPlugin
      ios:
        pluginClass: SmartBeePixelPlugin
