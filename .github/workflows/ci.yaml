name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# Least privilege: every job only reads the repository. Nothing is published from this workflow.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs; the comment after each SHA is the release it belongs to.

jobs:
  android:
    name: Android SDK and React Native bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests and React Native Android bridge build
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew :pixel:testDebugUnitTest :rn-bridge:assembleDebug
      - name: Maven publication builds
        working-directory: mobile/android
        run: ./gradlew :pixel:publishReleasePublicationToMavenLocal

  ios:
    name: iOS SDK and wrapper bridges (type check)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Unit tests
        run: SB_DUMP_FILE="$RUNNER_TEMP/batches.jsonl" swift test
      - name: Build for iOS
        run: xcodebuild build -scheme SmartBeePixel -destination 'generic/platform=iOS' -quiet CODE_SIGNING_ALLOWED=NO
      - name: Type-check the React Native and Flutter iOS bridges against stubs
        run: bash mobile/ci-stubs/typecheck-ios-bridges.sh
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate the batches sent by the tests against the spec schema
        run: |
          npm ci --ignore-scripts
          node spec/validate-batches.mjs "$RUNNER_TEMP/batches.jsonl"

  wrappers:
    name: Spec, React Native (JS) and Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Vendored native sources are in sync
        run: node mobile/sync-native.mjs --check
      - name: Spec tests
        run: |
          npm ci --ignore-scripts
          npm test -w spec
      - name: React Native JS tests
        working-directory: mobile/react-native
        run: node --test
      - name: npm package contents
        working-directory: mobile/react-native
        run: npm pack --dry-run
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      # A fixed Flutter release, so that a build is reproducible. It is also the minimum the package declares
      # (mobile/flutter/pubspec.yaml): raise both together.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - name: Flutter analyze and test
        working-directory: mobile/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: pub.dev package validation
        working-directory: mobile/flutter
        run: |
          # If the previous steps changed the working tree, show the change and undo it: the validation runs on a clean tree.
          git diff
          git checkout -- .
          flutter pub publish --dry-run
      # The plugin's Android code (Kotlin bridge + native core) is built inside a real Flutter app.
      # The key is a placeholder that is not registered anywhere; the app is only built, never run.
      - name: Build an Android app that uses the Flutter plugin
        run: |
          flutter create --platforms=android --project-name pixel_probe "$RUNNER_TEMP/pixel_probe"
          cd "$RUNNER_TEMP/pixel_probe"
          flutter pub add smartbee_pixel --path "$GITHUB_WORKSPACE/mobile/flutter"
          cat > lib/main.dart <<'DART'
          import 'package:flutter/widgets.dart';
          import 'package:smartbee_pixel/smartbee_pixel.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SmartBee.init('example0key00000');
            await SmartBee.track('Lead', props: {'source': 'ci'});
            runApp(const SizedBox());
          }
          DART
          rm -rf test
          flutter build apk --debug
