name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew :pixel:testDebugUnitTest :rn-bridge:assembleDebug
      - name: Maven publication builds
        working-directory: mobile/android
        run: ./gradlew :pixel:publishReleasePublicationToMavenLocal

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: SB_DUMP_FILE="$RUNNER_TEMP/batches.jsonl" swift test
      - name: Build for iOS
        run: xcodebuild build -scheme SmartBeePixel -destination 'generic/platform=iOS' -quiet CODE_SIGNING_ALLOWED=NO
      - name: Type-check React Native and Flutter iOS bridges
        run: bash mobile/ci-stubs/typecheck-ios-bridges.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate batches against the spec schema
        run: |
          npm install --ignore-scripts
          node spec/validate-batches.mjs "$RUNNER_TEMP/batches.jsonl"

  wrappers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendored native sources are in sync
        run: node mobile/sync-native.mjs --check
      - name: Spec tests
        run: |
          npm install --ignore-scripts
          npm test -w spec
      - name: React Native JS tests
        working-directory: mobile/react-native
        run: node --test
      - name: npm package contents
        working-directory: mobile/react-native
        run: npm pack --dry-run
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter analyze and test
        working-directory: mobile/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: pub.dev package validation
        working-directory: mobile/flutter
        run: |
          # Əvvəlki addımlar işçi qovluğu dəyişibsə göstər və geri qaytar: yoxlama təmiz vəziyyətdə aparılır.
          git diff
          git checkout -- .
          flutter pub publish --dry-run
      - name: Build an Android app that uses the plugin
        run: |
          flutter create --platforms=android --project-name pixel_probe "$RUNNER_TEMP/pixel_probe"
          cd "$RUNNER_TEMP/pixel_probe"
          flutter pub add smartbee_pixel --path "$GITHUB_WORKSPACE/mobile/flutter"
          cat > lib/main.dart <<'DART'
          import 'package:flutter/widgets.dart';
          import 'package:smartbee_pixel/smartbee_pixel.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SmartBee.init('demo0andr1');
            await SmartBee.track('Lead');
            runApp(const SizedBox());
          }
          DART
          rm -rf test
          flutter build apk --debug
